name: Test, build and release

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install test and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi python3-xlib python3-pytest desktop-file-utils
      - name: Run tests without a display or iPad
        run: ./test.sh --unit-only
      - name: Build reproducible release files
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            /usr/bin/python3 packaging/build_release.py --tag "$GITHUB_REF_NAME"
          else
            /usr/bin/python3 packaging/build_release.py
          fi
      - name: Verify package
        run: /usr/bin/python3 packaging/check_deb.py dist/*.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: padbridge-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install Windows development dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --only-binary=:all: -r requirements-windows-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Protocol, Windows backend and software encoder tests
        shell: pwsh
        run: .\test.ps1
      - name: Prepare pinned installer compiler
        shell: pwsh
        run: .\packaging\bootstrap_inno.ps1
      - name: Build Windows application and installer
        shell: pwsh
        run: .\.venv\Scripts\python.exe packaging\build_windows.py
      - name: Verify bundled dependencies and encoder
        shell: pwsh
        run: |
          .\dist\PadBridge\PadBridge.exe doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\PadBridge\PadBridge.exe encoder-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify install, upgrade, uninstall and running-app protection
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\windows\smoke_installer.py
      - name: Preserve installer failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer-logs-${{ github.sha }}
          path: build/installer-smoke-*/**/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: padbridge-windows-${{ github.sha }}
          path: |
            dist/padbridge-*-windows-x64.zip
            dist/padbridge-*-windows-x64-setup.exe
            dist/SHA256SUMS-windows
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: padbridge-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: padbridge-windows-${{ github.sha }}
          path: dist
      - name: Publish versioned packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.deb dist/*-source.tar.gz dist/*-windows-x64.zip dist/*-windows-x64-setup.exe dist/SHA256SUMS dist/SHA256SUMS-windows \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "PadBridge $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md
