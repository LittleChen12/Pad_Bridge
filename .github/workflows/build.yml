name: Test, build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install test and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi python3-xlib python3-pytest desktop-file-utils
      - name: Run tests without a display or iPad
        run: ./test.sh --unit-only
      - name: Build reproducible release files
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            /usr/bin/python3 packaging/build_release.py --tag "$GITHUB_REF_NAME"
          else
            /usr/bin/python3 packaging/build_release.py
          fi
      - name: Verify package
        run: /usr/bin/python3 packaging/check_deb.py dist/*.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: padbridge-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: padbridge-${{ github.sha }}
          path: dist
      - name: Publish versioned packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.deb dist/*-source.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "PadBridge $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md
